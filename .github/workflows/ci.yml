name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (windows-latest, node 22)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # 仓库根与 desktop 各有一份 lock，两个都要纳入缓存键
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install root dependencies
        run: npm ci

      # 会话存储的测试要真的打开 SQLite，所以 desktop 依赖（含 better-sqlite3 预编译二进制）
      # 必须排在 Test 之前。安装脚本跳过，改用显式的 setup:sqlite 让失败原因一目了然。
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts

      - name: Prepare better-sqlite3 binding (Electron + Node ABI)
        working-directory: desktop
        run: npm run setup:sqlite

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      # 主进程关键模块的类型契约（tsc --noEmit，只检查 3 个 .mjs）
      - name: Typecheck
        run: npm run typecheck

      # 只验证构建产物，不跑 electron-builder 打包（太重）
      - name: Build desktop
        working-directory: desktop
        run: npx electron-vite build

      # 冒烟脚本用 Python 标准库 sqlite3 只读校验落盘（不依赖 better-sqlite3 的 ABI）；
      # windows-latest 自带多版本 Python，但不保证 `python` 在 PATH，显式 setup 一步。
      - name: Setup Python (sqlite assertion)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 冒烟脚本直接跑 desktop/node_modules/electron；CI 的 desktop 依赖用 --ignore-scripts 安装，
      # Electron 二进制不会随 npm ci 下载，这里显式补齐（已安装时 install.js 会直接跳过）。
      - name: Ensure Electron runtime binary
        working-directory: desktop
        run: node node_modules/electron/install.js

      # 打包产物端到端冒烟：真实窗口 + 临时隔离数据目录，验证渲染层 / preload IPC / SQLite 落盘。
      # GitHub Windows runner 跑在无交互桌面会话（Session 0），GUI 窗口能否起来尚无 CI 实证；
      # 本地已实测通过，故先 continue-on-error，失败不把主流水变永久红，截图/日志 artifact 照常上传。
      - name: E2E smoke (built out/, isolated temp profile)
        run: npm run smoke:e2e
        continue-on-error: true

      - name: Upload E2E smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke
          path: e2e-artifacts/
          if-no-files-found: warn

  self-audit:
    name: self-audit (windows-latest, node 22)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      # L1 是唯一硬卡 S3 密钥的档位；clean clone 不应有未豁免的 high/card。
      # 先落报告再判定：audit 退出码可能是 1（拦）/3（无法验收），不等于报告不可读。
      - name: Run FinalCheck self-audit
        run: node bin/finalcheck.js audit . --tier L1 --json > self-audit.json || true

      - name: Check acceptance entries still match
        run: node scripts/check-accept-entries.mjs

      # 自审 high 是 advisory：仓库仍有已登记依赖告警/大文件等历史项，
      # 等基线清干净后再改成硬闸（见 docs/ACCEPTED-RISKS.md）。
      - name: Check self-audit high findings (advisory)
        continue-on-error: true
        run: node scripts/check-self-audit.mjs self-audit.json
