name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (windows-latest, node 20)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # 仓库根与 desktop 各有一份 lock，两个都要纳入缓存键
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install root dependencies
        run: npm ci

      # 会话存储的测试要真的打开 SQLite，所以 desktop 依赖（含 better-sqlite3 预编译二进制）
      # 必须排在 Test 之前。安装脚本跳过，改用显式的 setup:sqlite 让失败原因一目了然。
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts

      - name: Prepare better-sqlite3 binding (Electron + Node ABI)
        working-directory: desktop
        run: npm run setup:sqlite

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      # 只验证构建产物，不跑 electron-builder 打包（太重）
      - name: Build desktop
        working-directory: desktop
        run: npx electron-vite build
