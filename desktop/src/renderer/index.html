<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' fc-media:; worker-src 'self' blob:; frame-src 'self' data:" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect x='16' y='16' width='480' height='480' rx='112' fill='%231c1c20'/><g fill='none' stroke='%23deb06a' stroke-width='36' stroke-linecap='round' stroke-linejoin='round' transform='translate(-14 0)'><path d='M140 362 V196 q0 -44 44 -44 H226'/><path d='M140 258 H208'/><path d='M392 200 A88 88 0 1 0 374 338'/><path d='M356 272 L384 300 L436 240'/></g></svg>" />
    <title>FinalCheck</title>
    <script>
      // 首屏防闪：React 挂载前先把主题落到 <html>，否则深色用户会看到一帧白屏。
      // key 与 renderer/lib/theme.mjs 的 THEME_STORAGE_KEY 必须一致。
      // 这里读的是上次的本地缓存；config.json 才是权威值，React 挂载后会再纠正一次。
      try {
        var t = localStorage.getItem('fc.theme') === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch (e) { /* localStorage 不可用：交给默认深色 */ }
    </script>
  </head>
  <body class="bg-base text-ink">
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
