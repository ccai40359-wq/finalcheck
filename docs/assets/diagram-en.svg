<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Why FinalCheck: tiered delivery acceptance">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="42%">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#d4a574" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr-gold" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#d4a574"/>
    </marker>
  </defs>
  <rect width="1200" height="660" fill="#0a0a0a"/>
  <rect width="1200" height="660" fill="url(#glow)"/>
  <style>
    text { font-family: -apple-system,"Segoe UI",Arial,"Microsoft YaHei","PingFang SC",sans-serif; }
    .ttl { font-family: Georgia,"Times New Roman",serif; font-size: 22px; font-weight: 700; fill: #f5f0eb; }
    .tag { font-size: 11px; fill: #a39787; }
    .lbl { font-family: Georgia,"Times New Roman",serif; font-size: 11px; font-weight: 700; fill: #c9a96e; opacity: 0.75; }
    .nm  { font-size: 13px; font-weight: 600; }
    .sm  { font-size: 10px; fill: #a39787; }
    .xs  { font-size: 9px; fill: #6b5f53; }
    .pill { font-size: 9px; fill: #cdc4b6; }
  </style>

  <text x="60" y="52" class="ttl">Why FinalCheck</text>
  <text x="1140" y="50" class="tag" text-anchor="end">Tiered delivery acceptance — not another scanner</text>

  <!-- A: input -->
  <rect x="60" y="110" width="230" height="120" rx="6" fill="#111111" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="76" y="140" class="nm" fill="#94a3b8">Your code</text>
  <text x="76" y="162" class="sm">AI-written or downloaded</text>
  <text x="76" y="180" class="xs">11 dimensions to check</text>
  <text x="76" y="206" class="xs">Desktop app · runs locally</text>

  <line x1="292" y1="178" x2="384" y2="178" stroke="#d4a574" stroke-width="2" marker-end="url(#arr-gold)"/>

  <!-- B: gate -->
  <rect x="390" y="96" width="420" height="196" rx="8" fill="none" stroke="#d4a574" stroke-width="0.5" stroke-dasharray="6,4" opacity="0.45"/>
  <text x="404" y="116" class="lbl">DELIVERY GATE · THREE TIERS</text>

  <rect x="406" y="126" width="388" height="48" rx="6" fill="#1a1a1a" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="420" y="146" class="nm" fill="#fbbf24">L1 Personal</text>
  <text x="420" y="164" class="sm">S3 secrets block; rest advisory</text>

  <rect x="406" y="182" width="388" height="48" rx="6" fill="#1a1a1a" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="420" y="202" class="nm" fill="#a78bfa">L2 With users</text>
  <text x="420" y="220" class="sm">High blocks, medium must be fixed</text>

  <rect x="406" y="238" width="388" height="48" rx="6" fill="#1a1a1a" stroke="#f87171" stroke-width="1.2"/>
  <text x="420" y="258" class="nm" fill="#f87171">L3 Company</text>
  <text x="420" y="276" class="sm">Nothing ships until the matrix passes; report to show</text>

  <line x1="812" y1="178" x2="856" y2="178" stroke="#d4a574" stroke-width="2" marker-end="url(#arr-gold)"/>

  <!-- C: verdict -->
  <rect x="860" y="96" width="280" height="196" rx="8" fill="none" stroke="#d4a574" stroke-width="0.5" stroke-dasharray="6,4" opacity="0.45"/>
  <text x="874" y="116" class="lbl">OUTPUT · ONE VERDICT</text>
  <rect x="874" y="128" width="252" height="30" rx="15" fill="#111111" stroke="#5a9e6f" stroke-width="1.2"/>
  <text x="890" y="147" class="nm" fill="#5a9e6f" font-size="12">Pass</text>
  <text x="1112" y="147" class="sm" text-anchor="end">within this run's scope</text>
  <rect x="874" y="166" width="252" height="30" rx="15" fill="#111111" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="890" y="185" class="nm" fill="#fbbf24" font-size="12">Fix, then pass</text>
  <text x="1112" y="185" class="sm" text-anchor="end">open items to confirm</text>
  <rect x="874" y="204" width="252" height="30" rx="15" fill="#111111" stroke="#f87171" stroke-width="1.2"/>
  <text x="890" y="223" class="nm" fill="#f87171" font-size="12">Block</text>
  <text x="1112" y="223" class="sm" text-anchor="end">confirmed high / gate failed</text>
  <rect x="874" y="242" width="252" height="30" rx="15" fill="#111111" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="890" y="261" class="nm" fill="#94a3b8" font-size="12">Cannot accept</text>
  <text x="1112" y="261" class="sm" text-anchor="end">should-run checks missing</text>

  <!-- 11 dimensions -->
  <rect x="60" y="316" width="1080" height="86" rx="8" fill="none" stroke="#d4a574" stroke-width="0.5" stroke-dasharray="6,4" opacity="0.35"/>
  <text x="74" y="336" class="lbl">11 DIMENSIONS · ONE MATRIX TO PASS</text>
  <g>
    <rect x="68" y="350" width="80" height="32" rx="16" fill="#111111" stroke="#5a9e6f" stroke-width="1"/><text x="108" y="370" class="pill" text-anchor="middle">Security</text>
    <rect x="154" y="350" width="72" height="32" rx="16" fill="#111111" stroke="#38bdf8" stroke-width="1"/><text x="190" y="370" class="pill" text-anchor="middle">Privacy</text>
    <rect x="232" y="350" width="142" height="32" rx="16" fill="#111111" stroke="#fbbf24" stroke-width="1"/><text x="303" y="370" class="pill" text-anchor="middle">Supply chain &amp; licenses</text>
    <rect x="380" y="350" width="104" height="32" rx="16" fill="#111111" stroke="#a78bfa" stroke-width="1"/><text x="432" y="370" class="pill" text-anchor="middle">Maintainability</text>
    <rect x="490" y="350" width="84" height="32" rx="16" fill="#111111" stroke="#94a3b8" stroke-width="1"/><text x="532" y="370" class="pill" text-anchor="middle">Readability</text>
    <rect x="580" y="350" width="84" height="32" rx="16" fill="#111111" stroke="#5a9e6f" stroke-width="1"/><text x="622" y="370" class="pill" text-anchor="middle">Testability</text>
    <rect x="670" y="350" width="84" height="32" rx="16" fill="#111111" stroke="#f87171" stroke-width="1"/><text x="712" y="370" class="pill" text-anchor="middle">Robustness</text>
    <rect x="760" y="350" width="78" height="32" rx="16" fill="#111111" stroke="#38bdf8" stroke-width="1"/><text x="799" y="370" class="pill" text-anchor="middle">Stability</text>
    <rect x="844" y="350" width="92" height="32" rx="16" fill="#111111" stroke="#fbbf24" stroke-width="1"/><text x="890" y="370" class="pill" text-anchor="middle">Performance</text>
    <rect x="942" y="350" width="96" height="32" rx="16" fill="#111111" stroke="#a78bfa" stroke-width="1"/><text x="990" y="370" class="pill" text-anchor="middle">Observability</text>
    <rect x="1044" y="350" width="80" height="32" rx="16" fill="#111111" stroke="#94a3b8" stroke-width="1"/><text x="1084" y="370" class="pill" text-anchor="middle">Handover</text>
  </g>

  <!-- three differentiators -->
  <rect x="60" y="438" width="340" height="150" rx="8" fill="#111111" stroke="#d4a574" stroke-width="1"/>
  <text x="78" y="474" class="nm" fill="#d4a574">① Every claim is checkable</text>
  <text x="78" y="498" class="sm">Not "a possible risk" — file and line.</text>
  <text x="78" y="518" class="sm">A second agent argues against it; unconfirmed ≠ pass.</text>
  <text x="78" y="546" class="xs">rule · file:line · fingerprint · verdict</text>

  <rect x="430" y="438" width="340" height="150" rx="8" fill="#111111" stroke="#d4a574" stroke-width="1"/>
  <text x="448" y="474" class="nm" fill="#d4a574">② Unknown is not a pass</text>
  <text x="448" y="498" class="sm">Checks that did not run and targets that could</text>
  <text x="448" y="518" class="sm">not be reached never count as passed.</text>
  <text x="448" y="546" class="xs">coverage gap · cannot accept · fail-closed</text>

  <rect x="800" y="438" width="340" height="150" rx="8" fill="#111111" stroke="#d4a574" stroke-width="1"/>
  <text x="818" y="474" class="nm" fill="#d4a574">③ Local by design</text>
  <text x="818" y="498" class="sm">Engine and reports stay on your machine; keys</text>
  <text x="818" y="518" class="sm">never leave it. Commands run with write/delete bounds.</text>
  <text x="818" y="546" class="xs">local-first · restricted token · Apache-2.0</text>

  <text x="60" y="632" class="xs">Apache-2.0 · Windows desktop + CLI · English &amp; 中文</text>
  <text x="1140" y="632" class="xs" text-anchor="end">github.com/ccai40359-wq/finalcheck</text>
</svg>
